repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: (Common) Remove trailing whitespaces
      - id: mixed-line-ending
        name: (Common) Fix mixed line ending
        args: [--fix=lf]
      - id: end-of-file-fixer
        name: (Common) Remove extra EOF newlines
      - id: check-merge-conflict
        name: (Common) Check for merge conflicts
      - id: debug-statements
        name: (Python) Check for debugger imports
      - id: check-yaml
        name: (YAML) Check syntax
      - id: check-toml
        name: (TOML) Check syntax
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        name: (Markdown) Format with mdformat
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.15.15
    hooks:
      # Run the linter.
      - id: ruff-check
        name: (Python) Ruff check and fix
        args: [--fix]
      # Run the formatter.
      - id: ruff-format
        name: (Python) Ruff format
  #  - repo: https://github.com/pre-commit/mirrors-mypy
  #    rev: v0.902
  #    hooks:
  #      - id: mypy
  #        name: (Python) Check with mypy
  #        additional_dependencies:
  #          - tokenize-rt
  #          - types-pyyaml
  #          - types-toml
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v22.1.5
    hooks:
      - id: clang-format
        name: (C/C++/CUDA) Format with clang-format
        args: [-style=google, -i]
        types_or: [c, c++, cuda]
